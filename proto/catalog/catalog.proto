syntax = "proto3";

package catalog;

option go_package = "github.com/f4ke-n0name/autoparts-hub/gen/catalog;catalog";

service CatalogService {
  rpc CreatePart (CreateRequest) returns (CreateResponse);
  rpc GetPart (GetPartRequest) returns (GetPartResponse);
  rpc SearchParts (SearchPartsRequest) returns (SearchPartsResponse);
  rpc ListCategories (ListCategoriesRequest) returns (ListCategoriesResponse);
}

message AutoPart {
  string id = 1;
  string sku = 2;
  string name = 3;
  string description = 4;
  string brand = 5;
  double price = 6;
  string category_id = 7;
  int32 stock = 8;
}

message Category {
  string id = 1;
  string name = 2;
  string parent_id = 3;
}

message Compatibility {
  string make = 1;
  string model = 2;
  int32  year_from = 3;
  int32  year_to = 4;
}

message CreateRequest {
  string name = 1;
  string sku = 2;
  string description = 3;
  string brand = 4;
  double price = 5;
  string category_id = 6;
}

message CreateResponse {
  AutoPart part = 1;
}

message GetPartRequest {
  string id = 1;
}

message GetPartResponse {
  AutoPart part = 1;
  repeated Compatibility compatibility = 2;
}

message SearchPartsRequest {
  string query = 1;
  string category_id = 2;
  string brand = 3;
  string make = 4;
  string model = 5;
  int32 year = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message SearchPartsResponse {
  repeated AutoPart parts = 1;
  int32 total = 2;
}

message ListCategoriesRequest {}

message ListCategoriesResponse {
  repeated Category categories = 1;
}